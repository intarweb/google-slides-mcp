[project]
name = "google-slides-mcp"
version = "0.1.0"
description = "Google Slides MCP: read a deck, batchUpdate it, and convert Office decks to native Slides."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.scripts]
google-slides-mcp = "google_slides_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_slides_mcp"]
